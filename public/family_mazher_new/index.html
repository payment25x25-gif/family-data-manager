<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>\n    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700&display=swap" rel="stylesheet">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="familyPageTitle">مدير بيانات العائلة</title>
    <link rel="stylesheet" href="styles.css">\n    <link rel="stylesheet" href="new_style.css">
</head>
<body>
    <div class="container">
        <!-- رأس الصفحة -->
        <header class="header">
            <div class="header-content">
                <h1 id="familyHeaderTitle">📊 مدير بيانات العائلة</h1>
                <button class="btn btn-secondary1" onclick="goBackToHome()">🏠 الرئيسية</button>
            </div>
            <div class="header-actions">
                <button class="btn btn-primary" id="btnAddPersonHeader" onclick="openAddPersonModal()">➕ إضافة شخص</button>
                <button class="btn btn-secondary" id="btnAddYearHeader" onclick="openAddYearModal()">📅 إضافة سنة</button>
                <button class="btn btn-success" id="btnSaveData" onclick="saveData()">💾 حفظ البيانات</button>
            </div>
        </header>

        <!-- قسم الأدوات والفلاتر -->
        <div class="toolbar">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="🔍 ابحث عن اسم..." onkeyup="filterTable()">
            </div>
            <div class="toolbar-actions">
                <button class="btn btn-small" onclick="exportToCSV()">📥 تصدير CSV</button>
                <button class="btn btn-small" onclick="location.reload()">🔄 تحديث</button>
            </div>
        </div>

        <!-- الجدول الرئيسي -->
        <div class="table-wrapper">
            <table id="dataTable" class="data-table">
                <thead>
                    <tr class="header-row">
                        <th class="col-number">#</th>
                        <th class="col-name">الاسم</th>
                        <th class="col-year" colspan="100">السنوات</th>
                    </tr>
                    <tr class="years-row" id="yearsRow">
                        <th colspan="2"></th>
                    </tr>
                </thead>
                <tbody id="tableBody">
                    <!-- سيتم ملء الجدول بواسطة JavaScript -->
                </tbody>
            </table>
        </div>

        <!-- زر إضافة صف جديد في الأسفل -->
        <div class="add-row-container" id="addRowContainer">
            <button class="btn btn-outline" onclick="openAddPersonModal()">➕ إضافة شخص جديد</button>
        </div>
    </div>

    <!-- مودال إضافة شخص جديد -->
    <div id="addPersonModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>إضافة شخص جديد</h2>
                <button class="close-btn" onclick="closeAddPersonModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="personName">اسم الشخص:</label>
                    <input type="text" id="personName" placeholder="أدخل الاسم الكامل" autofocus>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeAddPersonModal()">إلغاء</button>
                <button class="btn btn-primary" onclick="addNewPerson()">إضافة</button>
            </div>
        </div>
    </div>

    <!-- مودال إضافة سنة جديدة -->
    <div id="addYearModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>إضافة سنة جديدة</h2>
                <button class="close-btn" onclick="closeAddYearModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="yearInput">السنة الهجرية:</label>
                    <input type="number" id="yearInput" placeholder="مثال: 1451" autofocus>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeAddYearModal()">إلغاء</button>
                <button class="btn btn-primary" onclick="addNewYear()">إضافة</button>
            </div>
        </div>
    </div>

    <!-- مودال تعديل الخانة -->
    <div id="editCellModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>تعديل بيانات المشاركة والملاحظة</h2>
                <button class="close-btn" onclick="closeEditCellModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>الشخص: <span id="editPersonName"></span></label>
                    <label>السنة: <span id="editYearValue"></span></label>
                </div>
                <div class="form-group">
                    <label>حالة المشاركة:</label>
<div class="edit-options">
	                        <button class="option-btn" data-value="مشارك" onclick="setParticipationStatus('مشارك')">✅ مشارك</button>
	                        <button class="option-btn" data-value="X" onclick="setParticipationStatus('X')">❌ X</button>
	                        <button class="option-btn" data-value="-" onclick="setParticipationStatus('-')">⚪ -</button>
	                    </div>
	                    <input type="hidden" id="editParticipationStatus">
	                </div>
	                <div class="form-group">
	                    <label for="editNoteValue">الملاحظة (اختياري):</label>
	                    <textarea id="editNoteValue" rows="3" placeholder="أدخل أي ملاحظات إضافية"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeEditCellModal()">إلغاء</button>
                <button class="btn btn-primary" onclick="saveEditCell()">حفظ التعديلات</button>
            </div>
        </div>
    </div>

    <!-- مودال تعديل الاسم -->
    <div id="editNameModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>تعديل الاسم</h2>
                <button class="close-btn" onclick="closeEditNameModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="editNameValue">الاسم الجديد:</label>
                    <input type="text" id="editNameValue" placeholder="أدخل الاسم الجديد" autofocus>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeEditNameModal()">إلغاء</button>
                <button class="btn btn-primary" onclick="saveEditName()">حفظ</button>
                <button class="btn btn-danger" onclick="deletePersonRow()">حذف الشخص</button>
            </div>
        </div>
    </div>

    <!-- مودال تعديل السنة -->
    <div id="editYearHeaderModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h2>تعديل السنة</h2>
                <button class="close-btn" onclick="closeEditYearHeaderModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label for="editYearHeaderValue">السنة الجديدة:</label>
                    <input type="number" id="editYearHeaderValue" placeholder="مثال: 1451" autofocus>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeEditYearHeaderModal()">إلغاء</button>
                <button class="btn btn-primary" onclick="saveEditYearHeader()">حفظ</button>
                <button class="btn btn-danger" onclick="deleteYearColumn()">حذف السنة</button>
            </div>
        </div>
    </div>

    <!-- إشعارات -->
    <div id="notification" class="notification"></div>

    <script src="script.js"></script>
</body>
</html>
